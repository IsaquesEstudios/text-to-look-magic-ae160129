workflows:
  ios-simulator:
    name: iOS Simulator Build (App Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.discovery.investments"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build for simulator
        script: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working_directory: ios/App
    artifacts:
      - ios/App/build/ios/**/*.app
      - ios/App/build/**/*.app

  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Discovery Investments API Key
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.discovery.investments"
      vars:
        BUNDLE_ID: "com.discovery.investments"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project "App.xcodeproj" \
            --profile "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
            --profile "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision \
            --archive-method app-store \
            --code-signing-setup-verbose-logging
        working_directory: ios/App
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(date +%s)
          echo "Setting build number to: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist
        working_directory: ios/App
        working_directory: ios/App
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App" \
            --export-options-plist "$HOME/export_options.plist"
        working_directory: ios/App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - isaquesestudios@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
