workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Discovery Investments API Key
    environment:
      node: 18
      xcode: latest
      vars:
        BUNDLE_ID: "com.discovery.investments"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
        working_directory: ios/App
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
        working_directory: ios/App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - isaquesestudios@gmail.com
        notify:
          success: true
          failure: true
