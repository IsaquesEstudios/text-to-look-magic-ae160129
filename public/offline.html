<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Discovery Investments</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #141414;
      color: #f5f5f5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-top: env(safe-area-inset-top, 2rem);
      padding-bottom: env(safe-area-inset-bottom, 2rem);
      -webkit-user-select: none;
      user-select: none;
    }
    .container {
      text-align: center;
      max-width: 280px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 140px;
      margin: 0 auto 2.5rem;
      opacity: 0.9;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.25rem;
      opacity: 0.35;
      color: #888;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 0.8125rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    button {
      background: #307825;
      color: white;
      border: none;
      padding: 0.75rem 2.5rem;
      border-radius: 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.7; transform: scale(0.98); }
    .retry-hint {
      font-size: 0.6875rem;
      color: #555;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="app-icon.png" alt="Discovery" />
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
      <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>Sem conexão</h1>
    <p>Verifique sua internet e tente novamente.</p>
    <button onclick="location.reload()">Reconectar</button>
    <p class="retry-hint">O app será reconectado automaticamente quando a internet voltar.</p>
  </div>

  <script>
    // Auto-reconnect when network comes back
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
